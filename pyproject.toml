[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-wiki"
version = "0.3.3"
description = "Repository wiki, semantic code index, and Agent code-location infrastructure."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "repo-wiki contributors"},
]
keywords = ["code-index", "mcp", "agent", "semantic-search", "wiki", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1",
    "litellm>=1.35",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "tomli-w>=1.0",
    "tree-sitter>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-java>=0.21",
    "tree-sitter-ruby>=0.21",
    "chromadb>=0.5",
    "openai>=1.30",
    "mcp[cli]>=1.6",
    "fastapi>=0.100",
]

[project.scripts]
repo-wiki = "indexer.cli:main"

[project.urls]
Homepage = "https://github.com/xzf475/repo-wiki"
Documentation = "https://github.com/xzf475/repo-wiki#readme"
Issues = "https://github.com/xzf475/repo-wiki/issues"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
indexer = ["templates/*.j2", "static/*"]
